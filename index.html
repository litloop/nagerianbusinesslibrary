<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    id="meta-description"
    content=""
  />

  <meta name="theme-color" id="theme-color" content="#101C19" />

  <title id="page-title">DANGOTE IPO DECODED™</title>

  <!--
    FONT SYSTEM
    The final typography values are controlled through content.json.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ==========================================
       SITE APP
       ========================================== -->

  <div id="app">

    <!-- ==========================================
         STICKY HEADER
         ========================================== -->

    <header class="site-header" id="site-header">

      <div class="container header-inner">

        <a
          href="#top"
          class="brand"
          id="brand-link"
          aria-label="DANGOTE IPO DECODED home"
        >
          <span id="brand-name"></span>
        </a>

        <button
          class="menu-toggle"
          id="menu-toggle"
          type="button"
          aria-label="Open navigation"
          aria-expanded="false"
          aria-controls="mobile-navigation"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav
          class="desktop-navigation"
          id="desktop-navigation"
          aria-label="Main navigation"
        >
          <!-- Injected from JSON -->
        </nav>

      </div>

      <!-- Mobile navigation -->

      <nav
        class="mobile-navigation"
        id="mobile-navigation"
        aria-label="Mobile navigation"
        aria-hidden="true"
      >
        <div class="mobile-navigation-inner">

          <div id="mobile-nav-links">
            <!-- Injected from JSON -->
          </div>

          <a
            href="#"
            class="button button-primary mobile-nav-cta"
            data-checkout-link
          >
            <span data-primary-cta></span>
          </a>

        </div>
      </nav>

    </header>


    <main id="top">

      <!-- ==========================================
           01 — HERO
           ========================================== -->

      <section
        class="section hero-section"
        id="hero"
        data-section="hero"
      >

        <div class="container hero-grid">

          <div class="hero-content">

            <p
              class="eyebrow"
              id="hero-eyebrow"
            ></p>

            <h1 id="hero-headline"></h1>

            <p
              class="hero-subheadline"
              id="hero-subheadline"
            ></p>

            <p
              class="hero-description"
              id="hero-description"
            ></p>

            <div class="hero-actions">

              <a
                href="#"
                class="button button-primary"
                data-checkout-link
              >
                <span data-primary-cta></span>
              </a>

            </div>

            <p
              class="microcopy"
              id="hero-microcopy"
            ></p>

          </div>


          <div class="hero-visual">

            <div class="book-mockup-wrapper">

              <img
                id="hero-book-image"
                class="book-mockup"
                src=""
                alt=""
                loading="eager"
              />

            </div>

          </div>

        </div>

      </section>


      <!-- ==========================================
           02 — TRUST STRIP
           ========================================== -->

      <section
        class="trust-strip"
        id="trust-strip"
        aria-label="Book positioning"
      >

        <div class="container">

          <div
            class="trust-items"
            id="trust-items"
          >
            <!-- Injected from JSON -->
          </div>

        </div>

      </section>


      <!-- ==========================================
           03 — THE PROBLEM
           ========================================== -->

      <section
        class="section problem-section section-dark"
        id="problem"
        data-section="problem"
      >

        <div class="container">

          <div class="section-heading light">

            <p
              class="eyebrow"
              id="problem-eyebrow"
            ></p>

            <h2 id="problem-headline"></h2>

            <p
              id="problem-introduction"
              class="section-introduction"
            ></p>

          </div>


          <div
            class="question-grid"
            id="problem-questions"
          >
            <!-- Injected from JSON -->
          </div>


          <div class="problem-closing">

            <p id="problem-closing"></p>

          </div>

        </div>

      </section>


      <!-- ==========================================
           04 — THE PROMISE
           ========================================== -->

      <section
        class="section promise-section"
        id="promise"
        data-section="promise"
      >

        <div class="container">

          <div class="two-column">

            <div class="section-heading">

              <p
                class="eyebrow"
                id="promise-eyebrow"
              ></p>

              <h2 id="promise-headline"></h2>

            </div>

            <div>

              <p
                class="large-body"
                id="promise-description"
              ></p>

            </div>

          </div>


          <div
            class="decision-flow"
            id="decision-flow"
            aria-label="DANGOTE IPO decision process"
          >
            <!-- Injected from JSON -->
          </div>

        </div>

      </section>


      <!-- ==========================================
           05 — DECISION OS
           ========================================== -->

      <section
        class="section decision-os-section section-dark"
        id="decision-os"
        data-section="decision-os"
      >

        <div class="container">

          <div class="section-heading light centered">

            <p
              class="eyebrow"
              id="decision-os-eyebrow"
            ></p>

            <h2 id="decision-os-headline"></h2>

            <p
              id="decision-os-description"
              class="section-introduction"
            ></p>

          </div>


          <div
            class="decision-os-grid"
            id="decision-os-grid"
          >
            <!-- 8 OS cards injected from JSON -->
          </div>

        </div>

      </section>


      <!-- ==========================================
           06 — WHAT YOU'LL LEARN
           ========================================== -->

      <section
        class="section learning-section"
        id="learn"
        data-section="learn"
      >

        <div class="container">

          <div class="section-heading">

            <p
              class="eyebrow"
              id="learning-eyebrow"
            ></p>

            <h2 id="learning-headline"></h2>

            <p
              id="learning-description"
              class="section-introduction"
            ></p>

          </div>


          <div
            class="learning-grid"
            id="learning-grid"
          >
            <!-- Injected from JSON -->
          </div>

        </div>

      </section>


      <!-- ==========================================
           07 — PRACTICAL TOOLKIT
           ========================================== -->

      <section
        class="section toolkit-section"
        id="toolkit"
        data-section="toolkit"
      >

        <div class="container">

          <div class="section-heading centered">

            <p
              class="eyebrow"
              id="toolkit-eyebrow"
            ></p>

            <h2 id="toolkit-headline"></h2>

            <p
              id="toolkit-description"
              class="section-introduction"
            ></p>

          </div>


          <div
            class="toolkit-grid"
            id="toolkit-grid"
          >
            <!-- Injected from JSON -->
          </div>

        </div>

      </section>


      <!-- ==========================================
           08 — BOOK PREVIEW
           ========================================== -->

      <section
        class="section preview-section"
        id="preview"
        data-section="preview"
      >

        <div class="container">

          <div class="section-heading centered">

            <p
              class="eyebrow"
              id="preview-eyebrow"
            ></p>

            <h2 id="preview-headline"></h2>

            <p
              id="preview-description"
              class="section-introduction"
            ></p>

          </div>


          <div class="preview-carousel">

            <button
              class="carousel-button carousel-prev"
              id="preview-prev"
              type="button"
              aria-label="Previous preview"
            >
              ←
            </button>


            <div
              class="preview-stage"
              id="preview-stage"
            >
              <!-- Preview image injected from JSON -->
            </div>


            <button
              class="carousel-button carousel-next"
              id="preview-next"
              type="button"
              aria-label="Next preview"
            >
              →
            </button>

          </div>


          <div
            class="carousel-indicators"
            id="preview-indicators"
            aria-label="Preview pages"
          >
            <!-- Injected from JSON -->
          </div>


          <div class="center-action">

            <a
              href="#"
              class="button button-secondary"
              data-scroll-target="#purchase"
            >
              <span id="preview-cta"></span>
            </a>

          </div>

        </div>

      </section>


      <!-- ==========================================
           09 — WHO IS THIS FOR?
           ========================================== -->

      <section
        class="section audience-section"
        id="audience"
        data-section="audience"
      >

        <div class="container">

          <div class="section-heading centered">

            <p
              class="eyebrow"
              id="audience-eyebrow"
            ></p>

            <h2 id="audience-headline"></h2>

          </div>


          <div class="audience-columns">

            <div class="audience-card audience-positive">

              <h3 id="audience-positive-heading"></h3>

              <ul id="audience-positive-list">
                <!-- Injected from JSON -->
              </ul>

            </div>


            <div class="audience-card audience-negative">

              <h3 id="audience-negative-heading"></h3>

              <ul id="audience-negative-list">
                <!-- Injected from JSON -->
              </ul>

            </div>

          </div>

        </div>

      </section>


      <!-- ==========================================
           10 — PHILOSOPHY
           ========================================== -->

      <section
        class="section philosophy-section section-dark"
        id="philosophy"
        data-section="philosophy"
      >

        <div class="container philosophy-inner">

          <p
            class="eyebrow"
            id="philosophy-eyebrow"
          ></p>

          <blockquote id="philosophy-quote"></blockquote>

          <p
            class="philosophy-closing"
            id="philosophy-closing"
          ></p>

        </div>

      </section>


      <!-- ==========================================
           11 — WHY THIS BOOK?
           ========================================== -->

      <section
        class="section why-section"
        id="why"
        data-section="why"
      >

        <div class="container">

          <div class="section-heading centered">

            <p
              class="eyebrow"
              id="why-eyebrow"
            ></p>

            <h2 id="why-headline"></h2>

          </div>


          <div
            class="why-grid"
            id="why-grid"
          >
            <!-- Injected from JSON -->
          </div>

        </div>

      </section>


      <!-- ==========================================
           12 — ABOUT
           ========================================== -->

      <section
        class="section about-section"
        id="about"
        data-section="about"
      >

        <div class="container about-grid">

          <div class="about-image-wrapper">

            <img
              id="about-image"
              class="about-image"
              src=""
              alt=""
              loading="lazy"
            />

          </div>


          <div class="about-content">

            <p
              class="eyebrow"
              id="about-eyebrow"
            ></p>

            <h2 id="about-headline"></h2>

            <div id="about-body">
              <!-- Injected from JSON -->
            </div>

          </div>

        </div>

      </section>


      <!-- ==========================================
           13 — FAQ
           ========================================== -->

      <section
        class="section faq-section"
        id="faq"
        data-section="faq"
      >

        <div class="container">

          <div class="section-heading centered">

            <p
              class="eyebrow"
              id="faq-eyebrow"
            ></p>

            <h2 id="faq-headline"></h2>

          </div>


          <div
            class="faq-list"
            id="faq-list"
          >
            <!-- FAQ items injected from JSON -->
          </div>

        </div>

      </section>


      <!-- ==========================================
           14 — PURCHASE CTA
           ========================================== -->

      <section
        class="section purchase-section section-dark"
        id="purchase"
        data-section="purchase"
      >

        <div class="container purchase-inner">

          <p
            class="eyebrow"
            id="purchase-eyebrow"
          ></p>

          <h2 id="purchase-headline"></h2>

          <p
            id="purchase-description"
            class="purchase-description"
          ></p>


          <a
            href="#"
            class="button button-large button-gold"
            data-checkout-link
          >
            <span data-primary-cta></span>
          </a>


          <p
            class="purchase-microcopy"
            id="purchase-microcopy"
          ></p>

        </div>

      </section>


      <!-- ==========================================
           15 — DISCLAIMER
           ========================================== -->

      <section
        class="disclaimer-section"
        id="disclaimer"
      >

        <div class="container">

          <p id="disclaimer-text"></p>

        </div>

      </section>

    </main>


    <!-- ==========================================
         FOOTER
         ========================================== -->

    <footer class="site-footer">

      <div class="container footer-inner">

        <div class="footer-brand">

          <strong id="footer-brand"></strong>

          <span id="footer-tagline"></span>

        </div>


        <div
          class="footer-links"
          id="footer-links"
        >
          <!-- Injected from JSON -->
        </div>


        <div class="footer-bottom">

          <span id="copyright"></span>

          <span id="footer-education-note"></span>

        </div>

      </div>

    </footer>


    <!-- ==========================================
         MOBILE STICKY PURCHASE BAR
         ========================================== -->

    <div
      class="mobile-purchase-bar"
      id="mobile-purchase-bar"
      aria-hidden="true"
    >

      <div class="mobile-purchase-inner">

        <span id="mobile-purchase-label"></span>

        <a
          href="#"
          class="button button-primary mobile-sticky-button"
          data-checkout-link
        >
          <span data-primary-cta></span>
        </a>

      </div>

    </div>


  </div>


  <!-- ==========================================
       JAVASCRIPT
       ========================================== -->

  <script src="app.js" defer></script>

</body>
</html>
